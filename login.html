
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaDigital | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">NexaDigital.</div>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="navbar">
        <a href="website.html">Home</a>
        <a href="about_us.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="form-box">
    <h2>Welcome Back!</h2>
    <p>Login to your NexaDigital account.</p>

    <form onsubmit="handleLogin(event)">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" style="width:auto;">
                Remember me
            </label>
        </div>

        <button type="submit" class="btn">Login</button>

        <p id="loginMessage" class="form-message"></p>
    </form>

    <p style="margin-top:20px;">
        Don't have an account? Contact our team.
    </p>

    <p><a href="website.html">← Back to Home</a></p>
</div>

<footer>
    <p>© 2026 NexaDigital. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
